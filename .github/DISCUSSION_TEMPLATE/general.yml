title: " "
labels: ["Q&A"]
body:
  - type: markdown
    attributes:
      value: |
        Ask about setup, architecture, or how a view works. For bugs, use an **Issue** instead.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      placeholder: npm version, browser, artifact id, view name…
