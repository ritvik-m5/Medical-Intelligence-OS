name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pipeline gate
        run: npm run verify:pipeline

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage gate
        run: npm run test:coverage

  pages-build:
    name: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (GitHub Pages path)
        run: npm run build
        env:
          VITE_BASE: /Medical-Intelligence-OS/

  merge-gate:
    name: merge-gate
    needs: [verify, coverage, pages-build]
    runs-on: ubuntu-latest
    environment: merge-gate
    steps:
      - run: echo "All pre-merge checks passed."
